name: qualitycheck
on:
  push:
    branches:
      - main

jobs:
  ci-job:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: install dependencies
      run: pip install -r requirments.txt
    - name: run test and enforce code coverage
      run:
        pytest --cov=calc --cov-report=term

  cd-job:
    runs-on: ubuntu-latest
    needs: ci-job
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: print message
      run: echo "ready for deployment"        

